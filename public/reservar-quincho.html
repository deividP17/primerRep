<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservar Quincho/Salón</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="container nav"><p class="brand">GNM Tour</p><ul><li><a href="/index.html">Inicio</a></li><li><a href="/nosotros.html">Nosotros</a></li><li><a href="/reservar-viaje.html">Reservar Viaje</a></li><li><a href="/reservar-quincho.html">Reservar Quincho/Salón</a></li><li><a href="/contacto.html">Contacto</a></li></ul></div></header>
<section class="section"><div class="container"><h1>Reserva de Quincho o Salón</h1><form id="venueForm"><div class="row"><div><label>Fecha del evento</label><input id="eventDate" type="date" required></div><div><label>Cantidad de invitados</label><input id="guests" type="number" min="1" required></div></div><div class="row"><div><label>Tipo</label><select id="venueType" required><option value="">Seleccionar...</option><option value="quincho">Quincho</option><option value="salon">Salón</option></select></div><div><label>Método de pago</label><select id="venuePayment" required><option value="">Seleccionar...</option><option value="mercadopago">Mercado Pago</option><option value="transferencia">Transferencia</option><option value="debito">Tarjeta de débito</option><option value="credito">Tarjeta de crédito</option></select></div></div><label>Notas adicionales</label><textarea id="notes" rows="4"></textarea><button class="btn" type="submit">Reservar</button><p class="message" id="venueMsg"></p></form></div></section>
<script src="/app.js"></script>
<script>
document.getElementById('venueForm').addEventListener('submit', async (e)=>{
 e.preventDefault(); const user=getCurrentUser(); const msg=document.getElementById('venueMsg');
 if(!user){ return showMessage(msg,'Necesitás iniciar sesión para reservar.',false);} 
 const body={ userId:user.id, eventDate:eventDate.value, guests:Number(guests.value), venueType:venueType.value, notes:notes.value, paymentMethod:venuePayment.value };
 const res=await fetch('/api/bookings/venue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const data=await res.json(); showMessage(msg,data.message,res.ok);
});
</script>
<footer><div class="container">GNM Tour</div></footer><a class="whatsapp-btn" href="https://wa.me/5491100000000" target="_blank">WhatsApp Admin</a>
</body></html>
